name: Release

# この Mod だけを mods/<名前>/ の形で zip にしてリリースする（ModLoader は含めない）
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  WOTS4_SDK_REF: d2c4849c3ba7f71a7d05dc65c0f30fb10de7facd
  MOD_NAME: fps_uncap

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mod

      - uses: actions/checkout@v4
        with:
          repository: nagataaaas/wots4-mods
          ref: ${{ env.WOTS4_SDK_REF }}
          path: sdk
          token: ${{ secrets.WOTS4_SDK_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: テスト用の Python パッケージを入れる
        run: python -m pip install cryptography

      - name: build and test
        run: |
          cmake -S mod -B build -A Win32 -DWOTS4_SDK_DIR="${{ github.workspace }}/sdk"
          cmake --build build --config Release
          ctest --test-dir build -C Release -LE needs_exe --output-on-failure --timeout 300

      # NO_RELEASE の Mod は install の対象にならないので、ここで止まる
      - name: zip を作る
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $name = "${{ env.MOD_NAME }}"
          cmake --install build --config Release --component $name --prefix stage
          if (-not (Test-Path "stage/mods/$name/mod.dll")) {
            Write-Error "mod.dll がありません。CMakeLists.txt の NO_RELEASE を外してからタグを付けてください。"
            exit 1
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $zipName = $name.Replace('_', '-')
          Compress-Archive -Path stage/* -DestinationPath "dist/wots4-mod-$zipName-$version.zip"
          Get-ChildItem -Recurse stage

      - name: Release を作る
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ env.MOD_NAME }} ${{ github.ref_name }}" --generate-notes
